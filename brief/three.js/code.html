<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_11 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_11" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_11');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Interactive 3D Autonomous Office with Animated Characters & Zone Interaction
// Uses global THREE namespace, alpha: true, responsive resize

const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x051424, 0.018);

// Camera: Isometric perspective
const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 1000);
camera.position.set(38, 30, 42);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0x7388a5, 1.2);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0x60a5fa, 2.0);
dirLight.position.set(25, 45, 20);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 120;
dirLight.shadow.camera.left = -35;
dirLight.shadow.camera.right = 35;
dirLight.shadow.camera.top = 35;
dirLight.shadow.camera.bottom = -35;
scene.add(dirLight);

const cyanPoint = new THREE.PointLight(0x22d3ee, 3.5, 45);
cyanPoint.position.set(-12, 10, -10);
scene.add(cyanPoint);

const purplePoint = new THREE.PointLight(0xa855f7, 3.5, 45);
purplePoint.position.set(12, 8, 12);
scene.add(purplePoint);

const amberPoint = new THREE.PointLight(0xf59e0b, 3.0, 40);
amberPoint.position.set(10, 8, -12);
scene.add(amberPoint);

// Grid Floor / Blueprint Foundation
const floorGroup = new THREE.Group();
scene.add(floorGroup);

const gridHelper = new THREE.GridHelper(60, 40, 0x1e3a5f, 0x0c2138);
gridHelper.position.y = 0.02;
floorGroup.add(gridHelper);

const baseFloorGeo = new THREE.BoxGeometry(54, 0.6, 54);
const baseFloorMat = new THREE.MeshPhongMaterial({
  color: 0x061527,
  specular: 0x1e293b,
  shininess: 30
});
const baseFloor = new THREE.Mesh(baseFloorGeo, baseFloorMat);
baseFloor.position.y = -0.3;
baseFloor.receiveShadow = true;
floorGroup.add(baseFloor);

// Zone Platforms (5 Zones per PRD)
const zones = [
  { id: 'founder', name: 'Zone 01 // Founder Command', x: -14, z: 14, color: 0x6366f1, w: 10, d: 10 },
  { id: 'meeting', name: 'Zone 02 // Strategy Room', x: -13, z: -13, color: 0xf59e0b, w: 12, d: 11 },
  { id: 'devlab', name: 'Zone 03 // Core Dev & QA Lab', x: 14, z: -12, color: 0x10b981, w: 14, d: 12 },
  { id: 'marketing', name: 'Zone 04 // Studio & Sales', x: 14, z: 12, color: 0xec4899, w: 12, d: 11 },
  { id: 'hub', name: 'Central Neural Bus', x: 0, z: 0, color: 0x06b6d4, w: 8, d: 8 }
];

zones.forEach(z => {
  const pGeo = new THREE.BoxGeometry(z.w, 0.4, z.d);
  const pMat = new THREE.MeshPhongMaterial({
    color: 0x091c33,
    specular: z.color,
    shininess: 40
  });
  const plat = new THREE.Mesh(pGeo, pMat);
  plat.position.set(z.x, 0.2, z.z);
  plat.receiveShadow = true;
  floorGroup.add(plat);

  // Border glow ring
  const borderGeo = new THREE.BoxGeometry(z.w + 0.3, 0.1, z.d + 0.3);
  const borderMat = new THREE.MeshBasicMaterial({ color: z.color, wireframe: true });
  const border = new THREE.Mesh(borderGeo, borderMat);
  border.position.set(z.x, 0.42, z.z);
  floorGroup.add(border);
});

// Furniture Builder (Low-poly modern desks & monitors)
function createDesk(x, z, rotY = 0, monitorCount = 2, screenColor = 0x22d3ee) {
  const group = new THREE.Group();
  group.position.set(x, 0.4, z);
  group.rotation.y = rotY;

  // Table top
  const topGeo = new THREE.BoxGeometry(3.6, 0.2, 1.8);
  const topMat = new THREE.MeshPhongMaterial({ color: 0x0f2744 });
  const top = new THREE.Mesh(topGeo, topMat);
  top.position.y = 1.6;
  top.castShadow = true;
  top.receiveShadow = true;
  group.add(top);

  // Legs
  const legGeo = new THREE.CylinderGeometry(0.08, 0.08, 1.6, 8);
  const legMat = new THREE.MeshPhongMaterial({ color: 0x334155 });
  [[-1.6, -0.7], [1.6, -0.7], [-1.6, 0.7], [1.6, 0.7]].forEach(([lx, lz]) => {
    const leg = new THREE.Mesh(legGeo, legMat);
    leg.position.set(lx, 0.8, lz);
    leg.castShadow = true;
    group.add(leg);
  });

  // Monitors
  for (let i = 0; i < monitorCount; i++) {
    const monGroup = new THREE.Group();
    const monOffset = (i - (monitorCount - 1) / 2) * 1.1;
    monGroup.position.set(monOffset, 1.7, -0.4);

    const standGeo = new THREE.CylinderGeometry(0.04, 0.06, 0.4, 8);
    const stand = new THREE.Mesh(standGeo, legMat);
    stand.position.y = 0.2;
    monGroup.add(stand);

    const screenGeo = new THREE.BoxGeometry(1.0, 0.65, 0.06);
    const screenMat = new THREE.MeshBasicMaterial({ color: screenColor });
    const screenMesh = new THREE.Mesh(screenGeo, screenMat);
    screenMesh.position.y = 0.55;
    screenMesh.rotation.y = (i === 0 ? 0.1 : -0.1);
    monGroup.add(screenMesh);

    group.add(monGroup);
  }

  // Ergonomic Chair
  const chairGeo = new THREE.BoxGeometry(1.0, 0.15, 1.0);
  const chairMat = new THREE.MeshPhongMaterial({ color: 0x1e293b });
  const chair = new THREE.Mesh(chairGeo, chairMat);
  chair.position.set(0, 1.1, 0.8);
  group.add(chair);

  const backGeo = new THREE.BoxGeometry(0.9, 1.1, 0.15);
  const back = new THREE.Mesh(backGeo, chairMat);
  back.position.set(0, 1.65, 1.25);
  group.add(back);

  scene.add(group);
  return group;
}

// Populate Zones with Furniture
createDesk(-14, 14, -Math.PI / 4, 3, 0x818cf8); // Founder
createDesk(-13, -13, Math.PI / 4, 2, 0xfbbf24);  // PM / Meeting
createDesk(12, -14, -Math.PI * 0.75, 2, 0x34d399); // Dev
createDesk(16, -10, -Math.PI * 0.75, 2, 0x22d3ee); // QA
createDesk(14, 12, Math.PI * 0.75, 2, 0xf472b6);  // Marketing / Growth

// Meeting Table Centerpiece in Strategy Room
const roundTableGeo = new THREE.CylinderGeometry(2.5, 2.5, 0.25, 24);
const roundTableMat = new THREE.MeshPhongMaterial({ color: 0x112948 });
const roundTable = new THREE.Mesh(roundTableGeo, roundTableMat);
roundTable.position.set(-13, 1.6, -13);
scene.add(roundTable);

// Central Neural Hologram Beacon (Central Hub)
const hologramGroup = new THREE.Group();
hologramGroup.position.set(0, 2.5, 0);
scene.add(hologramGroup);

const ringGeo = new THREE.TorusGeometry(2.2, 0.05, 12, 48);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x22d3ee, wireframe: true });
const ring1 = new THREE.Mesh(ringGeo, ringMat);
ring1.rotation.x = Math.PI / 2;
hologramGroup.add(ring1);

const ring2 = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0x818cf8, wireframe: true }));
hologramGroup.add(ring2);

const coreGeo = new THREE.OctahedronGeometry(0.9, 0);
const coreMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true });
const coreMesh = new THREE.Mesh(coreGeo, coreMat);
hologramGroup.add(coreMesh);

// Low-Poly Character Builder (Box-Man Bipedal per PRD)
class OfficeAgent {
  constructor(name, role, color, startPos, waypoints) {
    this.name = name;
    this.role = role;
    this.color = color;
    this.homePos = new THREE.Vector3(startPos.x, startPos.y, startPos.z);
    this.waypoints = waypoints || [this.homePos];
    this.targetIdx = 0;
    this.state = 'WORKING'; // 'IDLE', 'WALKING', 'WORKING', 'CELEBRATE'
    this.speed = 3.5;
    this.bounceTimer = Math.random() * 10;
    this.workTimer = 0;

    // Root Group
    this.mesh = new THREE.Group();
    this.mesh.position.copy(this.homePos);

    // Body
    const bodyGeo = new THREE.BoxGeometry(0.8, 1.1, 0.5);
    const bodyMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
    this.body = new THREE.Mesh(bodyGeo, bodyMat);
    this.body.position.y = 1.35;
    this.body.castShadow = true;
    this.mesh.add(this.body);

    // Division Colored Vest/Accent
    const vestGeo = new THREE.BoxGeometry(0.84, 0.6, 0.54);
    const vestMat = new THREE.MeshLambertMaterial({ color: color });
    const vest = new THREE.Mesh(vestGeo, vestMat);
    vest.position.y = 1.45;
    this.mesh.add(vest);

    // Glowing Head (Changes color on activity per PRD)
    const headGeo = new THREE.BoxGeometry(0.65, 0.65, 0.65);
    this.headMat = new THREE.MeshLambertMaterial({
      color: 0xf1f5f9,
      emissive: color,
      emissiveIntensity: 0.35
    });
    this.head = new THREE.Mesh(headGeo, this.headMat);
    this.head.position.y = 2.25;
    this.head.castShadow = true;
    this.mesh.add(this.head);

    // Head Visor/Screen
    const visorGeo = new THREE.BoxGeometry(0.45, 0.22, 0.08);
    const visorMat = new THREE.MeshBasicMaterial({ color: 0x0284c7 });
    const visor = new THREE.Mesh(visorGeo, visorMat);
    visor.position.set(0, 2.25, 0.34);
    this.mesh.add(visor);

    // Limbs
    const limbGeo = new THREE.BoxGeometry(0.25, 0.8, 0.25);
    const limbMat = new THREE.MeshLambertMaterial({ color: 0x334155 });

    // Left Arm
    this.leftArm = new THREE.Mesh(limbGeo, limbMat);
    this.leftArm.position.set(-0.55, 1.35, 0);
    this.mesh.add(this.leftArm);

    // Right Arm
    this.rightArm = new THREE.Mesh(limbGeo, limbMat);
    this.rightArm.position.set(0.55, 1.35, 0);
    this.mesh.add(this.rightArm);

    // Left Leg
    this.leftLeg = new THREE.Mesh(limbGeo, limbMat);
    this.leftLeg.position.set(-0.25, 0.5, 0);
    this.mesh.add(this.leftLeg);

    // Right Leg
    this.rightLeg = new THREE.Mesh(limbGeo, limbMat);
    this.rightLeg.position.set(0.25, 0.5, 0);
    this.mesh.add(this.rightLeg);

    // Speech Bubble Marker / Beacon above head
    const beaconGeo = new THREE.ConeGeometry(0.22, 0.4, 4);
    const beaconMat = new THREE.MeshBasicMaterial({ color: color });
    this.beacon = new THREE.Mesh(beaconGeo, beaconMat);
    this.beacon.rotation.x = Math.PI;
    this.beacon.position.y = 2.9;
    this.mesh.add(this.beacon);

    scene.add(this.mesh);
  }

  update(delta) {
    this.bounceTimer += delta;
    this.beacon.position.y = 2.9 + Math.sin(this.bounceTimer * 4) * 0.08;
    this.beacon.rotation.y += delta * 2;

    if (this.state === 'WORKING') {
      // Gentle typing/breathing motion
      this.body.position.y = 1.35 + Math.sin(this.bounceTimer * 6) * 0.03;
      this.head.rotation.x = Math.sin(this.bounceTimer * 5) * 0.08;
      this.leftArm.rotation.x = -0.6 + Math.sin(this.bounceTimer * 12) * 0.2;
      this.rightArm.rotation.x = -0.6 - Math.cos(this.bounceTimer * 12) * 0.2;
      this.leftLeg.rotation.x = 0;
      this.rightLeg.rotation.x = 0;
      this.headMat.emissiveIntensity = 0.5 + Math.sin(this.bounceTimer * 8) * 0.3;

      // Randomly switch to walking periodically
      this.workTimer += delta;
      if (this.workTimer > 8 + Math.random() * 4) {
        this.workTimer = 0;
        this.state = 'WALKING';
        this.targetIdx = (this.targetIdx + 1) % this.waypoints.length;
      }
    } else if (this.state === 'WALKING') {
      const target = this.waypoints[this.targetIdx];
      const dir = new THREE.Vector3().subVectors(target, this.mesh.position);
      dir.y = 0;
      const dist = dir.length();

      if (dist < 0.25) {
        this.state = 'WORKING';
        this.workTimer = 0;
      } else {
        dir.normalize();
        this.mesh.position.addScaledVector(dir, this.speed * delta);
        const lookTarget = new THREE.Vector3().addVectors(this.mesh.position, dir);
        this.mesh.lookAt(lookTarget);

        // Walking leg swing & arm swing
        const walkSwing = Math.sin(this.bounceTimer * 14) * 0.7;
        this.leftLeg.rotation.x = walkSwing;
        this.rightLeg.rotation.x = -walkSwing;
        this.leftArm.rotation.x = -walkSwing;
        this.rightArm.rotation.x = walkSwing;
        this.body.position.y = 1.35 + Math.abs(Math.sin(this.bounceTimer * 14)) * 0.1;
      }
    } else if (this.state === 'CELEBRATE') {
      // Jumping excitedly (when hasCustomer = true)
      this.mesh.position.y = Math.abs(Math.sin(this.bounceTimer * 9)) * 1.4;
      this.leftArm.rotation.x = Math.PI - 0.4;
      this.rightArm.rotation.x = Math.PI - 0.4;
      this.leftArm.rotation.z = Math.sin(this.bounceTimer * 8) * 0.3;
      this.rightArm.rotation.z = -Math.sin(this.bounceTimer * 8) * 0.3;
      this.mesh.rotation.y += delta * 4;
      this.headMat.emissiveIntensity = 1.0;
    }
  }
}

// Create 5 Animated Agents based on PRD Divisions
const agents = [
  new OfficeAgent(
    'founder_agent',
    'Founder',
    0x6366f1, // Indigo
    new THREE.Vector3(-14, 0.4, 15.5),
    [new THREE.Vector3(-14, 0.4, 15.5), new THREE.Vector3(-4, 0.4, 4), new THREE.Vector3(-13, 0.4, -10)]
  ),
  new OfficeAgent(
    'pm_agent',
    'PM Agent',
    0xf59e0b, // Amber
    new THREE.Vector3(-13, 0.4, -11.2),
    [new THREE.Vector3(-13, 0.4, -11.2), new THREE.Vector3(-8, 0.4, -8), new THREE.Vector3(0, 0.4, 0)]
  ),
  new OfficeAgent(
    'dev_agent',
    'Dev Agent',
    0x10b981, // Emerald Green
    new THREE.Vector3(12, 0.4, -12.2),
    [new THREE.Vector3(12, 0.4, -12.2), new THREE.Vector3(13.5, 0.4, -9), new THREE.Vector3(4, 0.4, -4)]
  ),
  new OfficeAgent(
    'qa_agent',
    'QA Agent',
    0x06b6d4, // Cyan
    new THREE.Vector3(16, 0.4, -8.2),
    [new THREE.Vector3(16, 0.4, -8.2), new THREE.Vector3(12, 0.4, -10), new THREE.Vector3(6, 0.4, 0)]
  ),
  new OfficeAgent(
    'marketing_agent',
    'Marketing & Growth',
    0xec4899, // Pink
    new THREE.Vector3(14, 0.4, 13.8),
    [new THREE.Vector3(14, 0.4, 13.8), new THREE.Vector3(6, 0.4, 6), new THREE.Vector3(-4, 0.4, 4)]
  )
];

// Interactive Mouse Orbit & Raycasting
let isDragging = false;
let previousMousePosition = { x: 0, y: 0 };
let spherical = { radius: 55, theta: 0.85, phi: 0.95 };

container.addEventListener('mousedown', (e) => {
  isDragging = true;
  previousMousePosition = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => { isDragging = false; });

window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const deltaX = e.clientX - previousMousePosition.x;
  const deltaY = e.clientY - previousMousePosition.y;

  spherical.theta -= deltaX * 0.007;
  spherical.phi = Math.max(0.2, Math.min(Math.PI / 2.2, spherical.phi - deltaY * 0.007));

  camera.position.x = spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
  camera.position.y = spherical.radius * Math.cos(spherical.phi);
  camera.position.z = spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
  camera.lookAt(0, 0, 0);

  previousMousePosition = { x: e.clientX, y: e.clientY };
});

// Expose trigger celebration or camera preset for DOM HUD
window.triggerOfficeCelebration = function() {
  agents.forEach(a => {
    a.state = 'CELEBRATE';
    a.mesh.position.set((Math.random() - 0.5) * 6, 0.4, (Math.random() - 0.5) * 6);
  });
};

window.setOfficeCameraPreset = function(preset) {
  if (preset === 'founder') {
    camera.position.set(-14, 8, 22);
    camera.lookAt(-14, 1, 14);
  } else if (preset === 'devlab') {
    camera.position.set(14, 8, -4);
    camera.lookAt(14, 1, -12);
  } else if (preset === 'meeting') {
    camera.position.set(-13, 8, -5);
    camera.lookAt(-13, 1, -13);
  } else {
    // Overview
    camera.position.set(38, 30, 42);
    camera.lookAt(0, 0, 0);
    spherical.theta = 0.85;
    spherical.phi = 0.95;
  }
};

// Window Resize Handler
function handleResize() {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', handleResize);

// Clock & Animation Render Loop
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  // Rotate hologram core
  ring1.rotation.z += delta * 0.8;
  ring2.rotation.y += delta * 1.2;
  coreMesh.rotation.x += delta * 0.9;
  coreMesh.rotation.y += delta * 1.4;

  // Animate all agents
  agents.forEach(agent => agent.update(delta));

  renderer.render(scene, camera);
}
animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_11 -->
</body>
</html>
